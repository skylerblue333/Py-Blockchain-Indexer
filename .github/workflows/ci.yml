name: chain-catalog-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Build image
        run: docker build -t sky-chain-catalog:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-chain-catalog:ci -u)" != "0"
      - name: Smoke health
        run: |
          docker run -d --rm --name sky-chain-catalog-ci -p 18003:8000 sky-chain-catalog:ci
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18003/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs sky-chain-catalog-ci
          exit 1
